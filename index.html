<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>趙雲 · 徒手動作預覽</title><link rel="icon" type="image/png" href="/zhaoyun-preview-native.png"></head>
<body><main class="review">
<header><div><h1>趙雲</h1><p>徒手動作 · 像素角色預覽</p></div><a id="preview-link" href="/previews/idle.gif" target="_blank" rel="noopener">動作預覽 ↗</a></header>
<section id="viewport" aria-label="趙雲動畫預覽"><canvas id="stage"></canvas><div id="loading" role="status">正在載入角色…</div><div id="context-error" hidden>畫面已暫停。<button id="reload">重新載入</button></div><span id="view-name"></span></section>
<section class="controls" aria-label="動畫控制">
<label class="select-label" for="animation">選擇動作</label><select id="animation"></select>
<div class="play-row"><button id="play" aria-pressed="true">暫停</button><button id="replay">重播</button><button id="export">匯出 PNG</button></div>
<p id="now" role="status">站立 · Idle</p>
<div class="direction-row"><button id="previous" aria-label="上一個視角">↶</button><div id="views" role="group" aria-label="八方向"></div><button id="next" aria-label="下一個視角">↷</button></div>
<div class="adjust-row"><label for="speed">速度 <output id="speed-value">1.0×</output></label><input id="speed" type="range" min="0.25" max="2" step="0.25" value="1"><div class="zoom"><button id="smaller" aria-label="縮小">−</button><output id="zoom-value">100%</output><button id="larger" aria-label="放大">＋</button></div></div>
<p class="hint">出拳與受傷後回到站立。防禦、跪倒及倒地會保留姿勢，可切換動作或重播。</p>
</section><footer><a href="/zhaoyun-sheet.png" target="_blank" rel="noopener">角色圖集 ↗</a><a href="/previews/index.html">全部動作預覽 ↗</a><a href="/animation-acceptance.html">測試結果 ↗</a></footer>
</main><script type="module" src="/src/main.js"></script></body></html>
