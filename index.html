<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>趙雲 · 第一階段素材審閱</title>
    <link rel="icon" type="image/png" href="/zhaoyun-preview-native.png" />
  </head>
  <body>
    <main class="review">
      <header>
        <div>
          <h1>趙雲</h1>
          <p>第一階段 · 靜止角色還原</p>
        </div>
        <a
          href="/zhaoyun-four-view-comparison.png"
          target="_blank"
          rel="noopener"
          >四視圖對照 ↗</a
        >
      </header>
      <section id="viewport" aria-label="趙雲靜態角色預覽">
        <canvas id="stage"></canvas>
        <div id="loading" role="status">正在載入角色…</div>
        <span id="view-name">左前斜角</span>
      </section>
      <section class="controls" aria-label="角色控制">
        <div class="direction-row">
          <button id="previous" aria-label="上一個視角">↶</button>
          <div id="views" role="group" aria-label="八方向觀察"></div>
          <button id="next" aria-label="下一個視角">↷</button>
        </div>
        <div class="actions">
          <div class="zoom">
            <button id="smaller" aria-label="縮小">−</button
            ><output id="zoom-value">100%</output
            ><button id="larger" aria-label="放大">＋</button>
          </div>
          <button id="weapon" aria-pressed="true">長槍：顯示</button
          ><button id="export">匯出 PNG ↓</button>
        </div>
        <p class="status">素材待審閱 · 行走與刺槍動畫尚未製作</p>
      </section>
      <footer>
        <a href="/zhaoyun-preview.png" target="_blank" rel="noopener"
          >無武器透明預覽 ↗</a
        ><a href="/zhaoyun-sheet.png" target="_blank" rel="noopener">圖集</a
        ><a href="/zhaoyun-spear.png" target="_blank" rel="noopener"
          >獨立長槍</a
        >
      </footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
