<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f0d">
  <meta name="mobile-web-app-capable" content="yes">
  <title>江湖行</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="hud-money">銅錢 <b id="money">0</b></div>
    <div id="hud-quest" hidden></div>
  </div>
  <button id="btn-menu" aria-label="選單">☰</button>

  <div id="joy"><div id="joy-knob"></div></div>
  <button id="btn-b" class="act" aria-label="快走">疾</button>
  <button id="btn-a" class="act" aria-label="互動">談</button>

  <div id="dialog" hidden>
    <div id="dlg-name"></div>
    <div id="dlg-text"></div>
    <div id="dlg-next" hidden>▼</div>
  </div>

  <div id="banner"></div>
  <div id="fade"></div>

  <div id="menu" hidden>
    <div class="panel">
      <button id="m-resume">繼續</button>
      <button id="m-full">全螢幕</button>
      <button id="m-reset">刪除存檔</button>
    </div>
  </div>

  <div id="start">
    <h1>江湖行</h1>
    <p class="sub">原型 · 青石鎮</p>
    <div id="start-btns" hidden>
      <button id="btn-continue" hidden>繼續旅程</button>
      <button id="btn-new">新的旅程</button>
    </div>
    <p id="loading">載入中…</p>
  </div>

  <div id="rotate">
    <div class="phone"></div>
    <p>請將手機橫放</p>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
